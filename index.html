<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulateur V92 (Mouchard de Test)</title>
    <link rel="icon" href="https://github.com/pierrealainmory-hue/logistique-data-projet/blob/main/LogoEpurvertpetit.png?raw=true">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #e67e22; --success: #27ae60; --bg: #f4f7f9; --danger: #e74c3c; --info: #3498db; --lib: #8e44ad; --text: #546e7a; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 20px; background: var(--bg); color: #333; display: flex; flex-direction: column; min-height: 100vh; }
        .client-header { background: white; padding: 15px 25px; border-radius: 6px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; border-top: 6px solid var(--success); }
        .client-logo { height: 85px; width: auto; }
        .header-band { background: white; padding: 20px; border-radius: 6px; margin-bottom: 20px; border-top: 6px solid var(--primary); }
        .main-container { display: flex; gap: 25px; flex: 1; margin-bottom: 30px;}
        .left-panel { flex: 1; min-width: 420px; }
        .right-panel { flex: 2; min-width: 300px; display: flex; flex-direction: column; gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 6px; margin-bottom: 20px; border: 1px solid #eef2f7; }
        .form-group { flex: 1; display: flex; flex-direction: column; gap: 5px; min-width: 100px; }
        input, select { padding: 10px; border: 1px solid #dcdfe6; border-radius: 4px; width: 100%; box-sizing: border-box; }
        .btn-mini { padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; color: white; font-weight: bold; }
        #btn-validate-depot { background: var(--success); color: white; margin-top: 10px; width: auto; min-width: 200px; display: block; margin: 15px auto 0 auto; border: none; border-radius: 20px; padding: 10px 30px; font-weight: bold; }
        .kpi-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .kpi-card { background: white; padding: 15px; border-radius: 6px; text-align: center; border: 1px solid #ddd; }
        #map { height: 450px; width: 100%; border-radius: 6px; background-color: #e5e9ec; }
        #stops-list { list-style: none; padding: 0; }
        .stop-item { background: white; padding: 10px; margin-bottom: 8px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #eee; }
        .btn-main { background: var(--info); color: white; width: 100%; padding: 15px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        
        /* BOUTON TEST */
        #btn-export-project { background: #e74c3c; color: white; width: 300px; margin: 20px auto; border: none; border-radius: 4px; padding: 15px; font-weight: bold; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .backup-controls { display: flex; justify-content: center; gap: 15px; margin-top: 15px; }
        .btn-backup { background: #bdc3c7; color: white; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="client-header">
        <div style="display:flex; align-items:center; gap:20px;">
            <img src="https://www.parcs-naturels-regionaux.fr/sites/federationpnr/files/styles/contenu/public/image/parc/sans_titre.png?itok=z_7I7Msh" alt="Logo" class="client-logo">
            <div><h1 style="margin:0; color:var(--success);">PNR Préalpes d'Azur</h1><span>Simulateur V92 (TEST)</span></div>
        </div>
    </div>

    <div class="header-band" id="prod-band">
        <div id="header-form">
            <div class="header-row">
                <div class="form-group" style="flex:1.5;"><label>Nom Producteur</label><input type="text" id="pName" placeholder="Ferme..." oninput="checkP()"></div>
                <div class="form-group" style="flex:2;"><label>Adresse Dépôt</label><div style="display:flex; gap:5px;"><input type="text" id="pAddr"><button class="btn-mini" style="background:var(--info);" onclick="searchAddr('prod')">🔍</button></div></div>
            </div>
            <div class="header-row" style="background:#f8f9fa; padding:10px;">
                <div class="form-group"><label>Véhicule</label><select id="vType"><option>Petit utilitaire</option><option selected>Fourgon compact</option></select></div>
                <div class="form-group"><label>Conso</label><input type="number" id="vCons" value="8.5"></div>
                <div class="form-group"><label>Prix €/L</label><input type="number" id="fPrice" value="1.75"></div>
            </div>
            <button id="btn-validate-depot" onclick="lockDepot()">✅ Valider Dépôt</button>
        </div>
        <div id="header-summary" style="display:none; text-align:center;">
            <span id="summary-content" style="font-weight:bold; margin-right:15px;"></span>
            <button class="btn-mini" style="background:var(--info);" onclick="unlockDepot()">Modifier</button>
        </div>
    </div>

    <div class="main-container">
        <div class="left-panel blocked-area" id="locked-section">
            <div class="card" style="border-left:6px solid var(--accent);">
                <h3 style="margin:0; color:var(--accent);">Tournée</h3>
                <div style="display:flex; gap:10px; margin-top:10px;">
                    <div class="form-group"><label>Nom</label><input type="text" id="tName"></div>
                    <div class="form-group"><label>Jour</label><select id="tDay"><option>Lundi</option><option>Mardi</option></select></div>
                </div>
                <button class="btn-mini" style="margin-top:10px; background:#95a5a6;" onclick="newTour()">➕ Nouvelle</button>
            </div>

            <div class="card" style="border-left:6px solid var(--success);">
                <h3 style="margin:0;">Arrêt</h3>
                <div style="display:flex; gap:10px; margin-top:10px;">
                    <div class="form-group"><label>Client</label><input type="text" id="sClient"></div>
                    <div class="form-group"><label>Type</label><select id="sOpType"><option value="📦">Livraison</option></select></div>
                </div>
                <div class="form-group"><label>Adresse</label><div style="display:flex; gap:5px;"><input type="text" id="sAddr"><button class="btn-mini" style="background:var(--info);" onclick="searchAddr('stop')">🔍</button></div></div>
                <div style="display:flex; gap:10px; margin-top:10px;">
                    <div class="form-group"><label>CA €</label><input type="number" id="sEuro" value="0"></div>
                    <div class="form-group"><label>Vol kg</label><input type="number" id="sVol" value="0"></div>
                </div>
                <button class="btn-main" onclick="addStop()">➕ AJOUTER L'ARRÊT</button>
            </div>

            <ul id="stops-list"></ul>
            <button class="btn-main" style="background:var(--success);" onclick="saveTour()">💾 SAUVEGARDER TOURNEE</button>
        </div>

        <div class="right-panel">
            <div id="map"></div>
            <div class="kpi-container">
                <div class="kpi-card"><div>DISTANCE</div><div id="rDist" style="font-weight:bold; font-size:1.2rem;">0 km</div></div>
                <div class="kpi-card"><div>COÛT</div><div id="rTotal" style="font-weight:bold; font-size:1.2rem;">0 €</div></div>
            </div>
        </div>
    </div>

    <div class="card" style="border-left:6px solid var(--lib);">
        <h3 style="margin:0; color:var(--lib);">📂 Dossier Global</h3>
        <div id="tours-list-container" style="margin-top:15px;"></div>
        
        <div class="backup-controls">
            <button class="btn-mini btn-backup" onclick="downloadBackup()">📥 Sauvegarder JSON</button>
            <button class="btn-mini btn-backup" onclick="document.getElementById('fileInput').click()">📤 Restaurer JSON</button>
            <input type="file" id="fileInput" accept=".json" style="display:none" onchange="uploadBackup(this)">
        </div>

        <div style="display:flex; justify-content:center; margin-top:20px;">
            <button id="btn-export-project" onclick="sendData()">🔴 TESTER L'ENVOI (MOUCHARD)</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const API = "https://update-github-csv-149052175314.europe-west1.run.app/";
        let map, markers, routeLayer, stops=[], pData={lat:null}, sTemp={lat:null}, savedTours=[];

        window.onload = function() {
            map = L.map('map').setView([43.76, 6.90], 10);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            markers = L.layerGroup().addTo(map); routeLayer = L.layerGroup().addTo(map);
            map.on('click', onMapClick);
            Sortable.create(document.getElementById('stops-list'), {animation:150, onEnd:reorder});
            
            // CHARGEMENT MEMOIRE
            let s = localStorage.getItem('pnr_logistique_v83_clean');
            if(s) { let d=JSON.parse(s); pData=d.pData; document.getElementById('pName').value=d.pData.name||""; document.getElementById('pAddr').value=d.pData.addr||""; checkP(); }
            
            let t = localStorage.getItem('logistique_tours_v83_clean');
            savedTours = t ? JSON.parse(t) : [];
            renderList();
        };

        // FONCTIONS BASE
        function checkP(){ if(document.getElementById('pName').value && pData.lat){ document.getElementById('btn-validate-depot').style.opacity=1; document.getElementById('btn-validate-depot').disabled=false; document.getElementById('prod-band').classList.add('validated'); } saveD(); }
        function saveD(){ localStorage.setItem('pnr_logistique_v83_clean', JSON.stringify({pData:pData, veh:{name:document.getElementById('pName').value}})); }
        function lockDepot(){ document.getElementById('header-form').style.display='none'; document.getElementById('header-summary').style.display='block'; document.getElementById('summary-content').innerText="✅ "+document.getElementById('pName').value; document.getElementById('locked-section').classList.remove('blocked-area'); setTimeout(()=>map.invalidateSize(),200); }
        function unlockDepot(){ document.getElementById('header-form').style.display='block'; document.getElementById('header-summary').style.display='none'; document.getElementById('locked-section').classList.add('blocked-area'); }
        
        function onMapClick(e){ fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${e.latlng.lat}&lon=${e.latlng.lng}`).then(r=>r.json()).then(d=>{
            if(document.getElementById('header-form').style.display!=='none'){ pData={lat:e.latlng.lat, lon:e.latlng.lng, addr:d.display_name, name:document.getElementById('pName').value}; document.getElementById('pAddr').value=d.display_name; checkP(); updateView(); }
            else { sTemp={lat:e.latlng.lat, lon:e.latlng.lng}; document.getElementById('sAddr').value=d.display_name; L.circleMarker(e.latlng,{color:'red'}).addTo(markers); }
        });}
        function searchAddr(t){ let q=document.getElementById(t==='prod'?'pAddr':'sAddr').value; fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}&limit=1`).then(r=>r.json()).then(d=>{ if(d[0]){ let ll=[d[0].lat,d[0].lon]; map.setView(ll,14); if(t==='prod'){pData={lat:ll[0],lon:ll[1],addr:d[0].display_name};document.getElementById('pAddr').value=d[0].display_name;checkP();} else {sTemp={lat:ll[0],lon:ll[1]};document.getElementById('sAddr').value=d[0].display_name;L.circleMarker(ll,{color:'red'}).addTo(markers);} updateView(); }});}

        function addStop(){ if(!sTemp.lat)return alert('Position?'); stops.push({client:document.getElementById('sClient').value, icon:document.getElementById('sOpType').value, euro:parseFloat(document.getElementById('sEuro').value)||0, vol:parseFloat(document.getElementById('sVol').value)||0, time:15, lat:sTemp.lat, lon:sTemp.lon, addr:document.getElementById('sAddr').value, id:Date.now()}); sTemp={lat:null}; updateView(); }
        function updateView(){ markers.clearLayers(); routeLayer.clearLayers(); document.getElementById('stops-list').innerHTML=""; 
            if(pData.lat) L.marker([pData.lat,pData.lon]).addTo(markers);
            stops.forEach((s,i)=>{ document.getElementById('stops-list').innerHTML+=`<li class="stop-item"><b>${i+1}</b> ${s.client} <button class="btn-mini" style="background:red" onclick="stops.splice(${i},1);updateView()">X</button></li>`; L.circleMarker([s.lat,s.lon]).addTo(markers); });
            if(pData.lat && stops.length) calcRoute(); 
        }
        function calcRoute(){ 
            let pts=[[pData.lon,pData.lat],...stops.map(s=>[s.lon,s.lat]),[pData.lon,pData.lat]]; 
            fetch(`https://router.project-osrm.org/route/v1/driving/${pts.map(p=>p.join(',')).join(';')}?overview=full&geometries=geojson`).then(r=>r.json()).then(res=>{ if(res.code==='Ok'){ let r=res.routes[0]; L.polyline(r.geometry.coordinates.map(c=>[c[1],c[0]]),{color:'blue'}).addTo(routeLayer); 
            document.getElementById('rDist').innerText=(r.distance/1000).toFixed(1)+" km"; 
            let cost = (r.distance/1000 * 0.15) + (stops.length*5); 
            document.getElementById('rTotal').innerText=cost.toFixed(0)+" €";
            }});
        }
        function reorder(){ /* ... */ }

        function saveTour(){
            let n=document.getElementById('tName').value||"Tournée "+(savedTours.length+1);
            let t={id:Date.now(), name:n, day:document.getElementById('tDay').value, stops:stops, stats:{cost:parseFloat(document.getElementById('rTotal').innerText)||0, dist:parseFloat(document.getElementById('rDist').innerText)||0, ca:0}};
            savedTours.push(t); localStorage.setItem('logistique_tours_v83_clean', JSON.stringify(savedTours)); renderList(); stops=[]; updateView();
        }
        function renderList(){
            let c=document.getElementById('tours-list-container'); c.innerHTML=""; let gc=0, gkm=0;
            savedTours.forEach(t=>{ c.innerHTML+=`<div style="padding:10px; border-bottom:1px solid #eee;"><b>${t.name}</b> (${t.day})</div>`; gc+=t.stats.cost; gkm+=t.stats.dist; });
        }
        function newTour(){ stops=[]; updateView(); document.getElementById('tName').value=""; }
        function downloadBackup() { /* ... JSON Download code ... */ }
        function uploadBackup(input) { /* ... JSON Upload code ... */ }

        // --- ENVOI AVEC MOUCHARD ---
        function sendData(){
            if(!savedTours.length) return alert("Rien à envoyer");
            const btn=document.getElementById('btn-export-project');
            
            // 1. Préparation du JSON complet
            const fullData = {
                depot: pData,
                tours: savedTours
            };
            const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(fullData))));
            
            // 2. Ligne unique CSV (NOUVELLES CLES)
            const rowObject = {
                "P_Date": new Date().toISOString().split('T')[0],
                "P_Nom": document.getElementById('pName').value,
                "P_NbTours": savedTours.length,
                "P_CoutTotal": 0,
                "P_KmTotal": 0,
                "P_DataJSON": b64.substring(0, 50) + "..." // Juste le début pour l'alerte
            };

            // 3. LE MOUCHARD (ALERTE)
            const keys = Object.keys(rowObject).join(", ");
            alert("⚠️ TEST ENVOI \n\nVoici les colonnes qui vont être envoyées :\n" + keys + "\n\nSi vous voyez 'Tournée ID', c'est l'ancien code.\nSi vous voyez 'P_DataJSON', c'est le bon !");

            // 4. L'Envoi Réel
            const finalRow = { ...rowObject, "P_DataJSON": b64 }; // On remet le JSON entier
            
            btn.innerText="Envoi..."; btn.disabled=true;
            fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({rows:[finalRow]}) })
            .then(r=>{ if(r.ok) alert("✅ Succès !"); else alert("Erreur serveur"); })
            .catch(e=>alert("Erreur réseau"))
            .finally(()=>{ btn.innerText="🔴 TESTER L'ENVOI (MOUCHARD)"; btn.disabled=false; });
        }
    </script>
</body>
</html>
